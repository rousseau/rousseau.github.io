<script>
const svg=document.getElementById('roue'),st=document.getElementById('stage');
const V0=[0,0,3000,3300];let v=V0.slice();
const set=()=>svg.setAttribute('viewBox',v.map(n=>n.toFixed(1)).join(' '));
function zoom(f,cx,cy){const r=st.getBoundingClientRect();const sc=Math.max(v[2]/r.width,v[3]/r.height);const ox=(r.width-v[2]/sc)/2,oy=(r.height-v[3]/sc)/2;
 const px=v[0]+((cx??r.width/2)-ox)*sc,py=v[1]+((cy??r.height/2)-oy)*sc;const nw=Math.min(3000,Math.max(120,v[2]*f)),k=nw/v[2];
 v=[px-(px-v[0])*k,py-(py-v[1])*k,nw,v[3]*k];set();}
st.addEventListener('wheel',e=>{e.preventDefault();const r=st.getBoundingClientRect();zoom(e.deltaY>0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top);},{passive:false});
const P=new Map();let last=null,dist0=null;
st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);last=[e.clientX,e.clientY];st.style.cursor='grabbing';});
st.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,[e.clientX,e.clientY]);const r=st.getBoundingClientRect();const sc=Math.max(v[2]/r.width,v[3]/r.height);
 if(P.size===2){const [a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(dist0){zoom(dist0/d,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top);}dist0=d;return;}
 v[0]-=(e.clientX-last[0])*sc;v[1]-=(e.clientY-last[1])*sc;last=[e.clientX,e.clientY];set();});
const up=e=>{P.delete(e.pointerId);dist0=null;if(P.size===1)last=[...P.values()][0];st.style.cursor='grab';};
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
document.getElementById('zin').onclick=()=>zoom(1/1.4);document.getElementById('zout').onclick=()=>zoom(1.4);document.getElementById('zreset').onclick=()=>{v=V0.slice();set();};
